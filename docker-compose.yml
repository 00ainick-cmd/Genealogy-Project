version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storytree-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: storytree
      POSTGRES_PASSWORD: storytree_dev_password
      POSTGRES_DB: storytree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storytree"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
